name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Unit + smoke tests
        run: uv run pytest -m "not eval"

      - name: Build image
        run: docker build -t equip-agent .

      - name: Image smoke check
        run: docker run --rm equip-agent --help

      - name: Compose smoke check (server + client containers over HTTP)
        run: |
          docker compose up -d --wait mcp-server
          docker compose run --rm --entrypoint python agent -m equipment.agent.mcp_client
          docker compose down -v

  agent-eval:
    name: agent-eval
    needs: test
    # Build step 11: add `|| (github.event_name == 'push' && github.ref == 'refs/heads/main')`
    # once the agent and tests/evals exist. Manual-only until then.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build test image
        run: docker build --target test -t equip-agent-test .

      - name: Run live-LLM evals
        env:
          ANTHROPIC_FOUNDRY_API_KEY: ${{ secrets.ANTHROPIC_FOUNDRY_API_KEY }}
          ANTHROPIC_FOUNDRY_RESOURCE: ${{ secrets.ANTHROPIC_FOUNDRY_RESOURCE }}
          AGENT_MODEL: ${{ secrets.AGENT_MODEL }}
        run: |
          docker run --rm \
            -e ANTHROPIC_FOUNDRY_API_KEY \
            -e ANTHROPIC_FOUNDRY_RESOURCE \
            -e AGENT_MODEL \
            equip-agent-test pytest -m eval
