name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Unit + smoke tests
        run: uv run pytest -m "not eval"

      - name: Build image
        run: docker build -t equip-agent .

      - name: Image smoke check
        run: docker run --rm equip-agent --help

      - name: Compose smoke check (server + client containers over HTTP)
        run: |
          docker compose up -d --wait mcp-server
          docker compose run --rm --entrypoint python agent -m equipment.agent.mcp_client
          docker compose down -v

  agent-eval:
    name: agent-eval
    needs: test
    # Live model calls cost money, so they run after a merge into main (5 tests), or on demand
    # from Actions > CI > Run workflow. Never on pull requests or other branches.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build test image
        run: docker build --target test -t equip-agent-test .

      - name: Run live-LLM evals (4 demo scenarios + 1 fault-injection reflection test)
        env:
          ANTHROPIC_FOUNDRY_API_KEY: ${{ secrets.ANTHROPIC_FOUNDRY_API_KEY }}
          ANTHROPIC_FOUNDRY_BASE_URL: ${{ secrets.ANTHROPIC_FOUNDRY_BASE_URL }}
          AGENT_MODEL: ${{ secrets.AGENT_MODEL }}
        run: |
          docker run --rm \
            -e ANTHROPIC_FOUNDRY_API_KEY \
            -e ANTHROPIC_FOUNDRY_BASE_URL \
            -e AGENT_MODEL \
            equip-agent-test pytest -m eval -s \
              "tests/evals/test_comparison_live.py::test_before_and_after_reflection[01-second-monitor]" \
              "tests/evals/test_comparison_live.py::test_before_and_after_reflection[04-contractor-laptop]" \
              "tests/evals/test_comparison_live.py::test_before_and_after_reflection[06-broken-monitor-exception]" \
              "tests/evals/test_comparison_live.py::test_before_and_after_reflection[07-contradictory-age]" \
              "tests/evals/test_reflection_live.py::test_claimed_exception_revises_policy_only_denial"
