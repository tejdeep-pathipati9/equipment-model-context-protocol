[project]
name = "equipment-agent"
version = "0.1.0"
description = "IT equipment request handler: MCP server + ReAct agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "mcp",
]

[project.scripts]
seed = "equipment.data.seed:main"
server = "equipment.server:main"
agent = "equipment.agent.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/equipment"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "eval: live-LLM agent evals (agent-eval CI job only)",
]
addopts = "-ra -m 'not eval'"  # evals call the live model; run them with -m eval

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
